name: Update Repo Tiles

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-repos
  cancel-in-progress: false

jobs:
  update-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch repos and build data/repos.json
        env:
          GH_TOKEN: ${{ secrets.REPOS_SCAN_TOKEN }}
        run: |
          set -euo pipefail

          : "${GH_TOKEN:?REPOS_SCAN_TOKEN secret is required (Settings > Secrets and variables > Actions)}"

          tmp_all="$(mktemp)"
          echo "[]" > "$tmp_all"

          page=1
          while :; do
            resp="$(curl -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user/repos?affiliation=owner&per_page=100&page=${page}")"

            count="$(echo "$resp" | jq 'length')"
            if [ "$count" -eq 0 ]; then
              break
            fi

            jq -s '.[0] + .[1]' "$tmp_all" <(echo "$resp") > "${tmp_all}.next"
            mv "${tmp_all}.next" "$tmp_all"

            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done

          now="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          jq --arg now "$now" '
            map(select(.archived == false)) as $active
            | ($active | map(select(.private == false))) as $pub
            | ($active | map(select(.private == true)))  as $priv
            | def toTile: {
                name: .name,
                description: .description,
                html_url: .html_url,
                language: .language,
                stargazers_count: .stargazers_count,
                updated_at: .updated_at
              };
            {
              updatedAt: $now,
              publicRepos: ($pub  | map(toTile) | sort_by(.updated_at) | reverse),
              privateRepos: ($priv | map(toTile) | sort_by(.updated_at) | reverse)
            }
          ' "$tmp_all" > data/repos.json

          rm -f "$tmp_all"

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/repos.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update repo tiles"
            git push
          fi
